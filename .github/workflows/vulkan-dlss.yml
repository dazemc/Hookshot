# NVIDIA DLSS is a local build's option: NVIDIA's SDK is never part of Hookshot or its downloads. This only checks that
# hookshot_vk.dll still compiles and links with it, through llvm-mingw as players build it. It runs by hand, and on a push or
# pull request only when a file DLSS's build depends on changed (the paths below), not on every push. The Rust engine
# builds the Windows DLL (build.vk) and fetches the SDK at its pinned release (build.ngx_fetch, ported from
# scripts/ngx_sdk.py), SHA-256 checked, without DLSS's runtime: NVIDIA's license is accepted for that run alone, and
# nothing of it is uploaded or cached.
# AMD FSR 4 (HOOKSHOT_FSR=1: AMD's MIT headers, nothing downloaded) is built in the same run: both engines share
# vk_temporal.cpp.
name: Vulkan back end with NVIDIA DLSS

on:
  push:
    branches: [main, dev]
    paths:
      - 'gpu/vk/vk_dlss*'
      - 'gpu/vk/vk_temporal*'
      - 'gpu/vk/vk_fsr4*'
      - 'third_party/fidelityfx/**'
      - 'gpu/vk/vk_reflex*'
      - 'gpu/vk/vk_ngx_msvc_rt.cpp'
      - 'gpu/vk/upscaler_rows.h'
      - 'gpu/vk/dlss_math.h'
      - 'gpu/vk/dlss_checks.h'
      - 'gpu/vk/shaders/dlss_*'
      - 'host/mingw_msvc_shims.c'
      - 'builder/rust/Cargo.toml'
      - 'builder/rust/Cargo.lock'
      - 'builder/rust/src/**'
      - 'scripts/windows/release_parts.sh'
      - '.github/workflows/vulkan-dlss.yml'
  pull_request:
    paths:
      - 'gpu/vk/vk_dlss*'
      - 'gpu/vk/vk_temporal*'
      - 'gpu/vk/vk_fsr4*'
      - 'third_party/fidelityfx/**'
      - 'gpu/vk/vk_reflex*'
      - 'gpu/vk/vk_ngx_msvc_rt.cpp'
      - 'gpu/vk/upscaler_rows.h'
      - 'gpu/vk/dlss_math.h'
      - 'gpu/vk/dlss_checks.h'
      - 'gpu/vk/shaders/dlss_*'
      - 'host/mingw_msvc_shims.c'
      - 'builder/rust/Cargo.toml'
      - 'builder/rust/Cargo.lock'
      - 'builder/rust/src/**'
      - 'scripts/windows/release_parts.sh'
      - '.github/workflows/vulkan-dlss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  vulkan-dlss:
    name: Windows Vulkan back end with NVIDIA DLSS and AMD FSR 4 (llvm-mingw, link check)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned Vulkan headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 74d8a6cb930c68ef617b202c3ff3c59d919e086b # v1.4.345
          path: _deps/cpm/vulkanheaders/v1.4.345
          persist-credentials: false
      - name: Check out pinned SPIR-V headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 04f10f650d514df88b76d25e83db360142c7b174 # vulkan-sdk-1.4.341.0
          path: _deps/cpm/spirv-headers/vulkan-sdk-1.4.341.0
          persist-credentials: false
      - name: Check out pinned VulkanMemoryAllocator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator
          ref: 1d8f600fd424278486eade7ed3e877c99f0846b1 # v3.3.0
          path: _deps/cpm/vulkanmemoryallocator/v3.3.0
          persist-credentials: false
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: llvm-mingw version
        id: llvm
        run: echo "name=$(scripts/windows/release_parts.sh llvm-mingw --name)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm.outputs.name }}
      - name: llvm-mingw
        run: echo "HOOKSHOT_MINGW=$(scripts/windows/release_parts.sh llvm-mingw "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"
      - name: Rust engine
        run: cargo build --release --locked --bin hookshot_engine --manifest-path builder/rust/Cargo.toml
      # (NVIDIA's license accepted for this run alone, as scripts/ngx_sdk.py --accept-nvidia-license did: the engine's
      # build.ngx_fetch writes only the headers and the library the build links, never DLSS's runtime)
      - name: NVIDIA's DLSS SDK (headers and nvsdk_ngx_s.lib)
        run: |
          sdk=$(cygpath -m "$RUNNER_TEMP/ngx-sdk")
          printf '{"command":"build.ngx_fetch","sdk":"%s","runtime":false}\n' "$sdk" |
            ./builder/rust/target/release/hookshot_engine.exe > "$RUNNER_TEMP/ngx-sdk.json"
          cat "$RUNNER_TEMP/ngx-sdk.json"
          if grep -q '"error"' "$RUNNER_TEMP/ngx-sdk.json"; then
            echo "::error::the Rust engine could not fetch NVIDIA's DLSS SDK"
            exit 1
          fi
          test -f "$RUNNER_TEMP/ngx-sdk/lib/nvsdk_ngx_s.lib"
      # (the engine builds the Windows DLL through llvm-mingw: the NGX and FSR 4 flags come from HOOKSHOT_NGX_SDK and
      # HOOKSHOT_FSR, as on the Python path; .ngx and .fsr4 in its answer say both were compiled in)
      - name: hookshot_vk.dll with NVIDIA DLSS and AMD FSR 4
        env:
          RX_TARGET: windows
          RX_VK_ONLY: '1'
          RX_RELEASE: '1'
          HOOKSHOT_FSR: '1'
          HOOKSHOT_NGX_SDK: ${{ runner.temp }}/ngx-sdk
        run: |
          work=$(cygpath -m "$RUNNER_TEMP/vk-work")
          printf '{"command":"build.vk","work":"%s"}\n' "$work" |
            ./builder/rust/target/release/hookshot_engine.exe > "$RUNNER_TEMP/vk-build.json"
          cat "$RUNNER_TEMP/vk-build.json"
          if ! jq -e '.built == true and .ngx != null and .fsr4 != null' "$RUNNER_TEMP/vk-build.json" >/dev/null; then
            jq -r '.message // .reason // .error // "the Vulkan back end was not built with DLSS and FSR 4"' \
              "$RUNNER_TEMP/vk-build.json" >&2 || true
            exit 1
          fi
          test -f "$RUNNER_TEMP/vk-work/sa/build/hookshot_vk.dll"
      # (what it loads is only Windows' own: the system DLLs and the UCRT's api-ms-win-crt-*. NVIDIA's runtime, nvngx_dlss.dll,
      # is loaded by NGX at run time from the game folder's ngx folder, and its core, _nvngx.dll, from the driver's)
      - name: Imports
        run: |
          dll="$RUNNER_TEMP/vk-work/sa/build/hookshot_vk.dll"
          "$HOOKSHOT_MINGW/bin/llvm-objdump" -p "$dll" | sed -n 's/^ *DLL Name: //p' | tr -d '\r' | sort -u | tee "$RUNNER_TEMP/imports.txt"
          if grep -viE '^(kernel32|user32|gdi32|advapi32)\.dll$|^api-ms-win-crt-[a-z0-9-]+\.dll$' "$RUNNER_TEMP/imports.txt"; then
            echo "::error::hookshot_vk.dll with NVIDIA DLSS imports a DLL that is not Windows' own (above)"
            exit 1
          fi
