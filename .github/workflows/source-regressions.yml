# Every game-free check that does not need a GPU, the game or a dump, on every pull request to main and every push to
# it: cargo test --workspace in builder/rust on Linux and Windows, flutter test and flutter analyze in builder/flutter,
# the focused SPIR-V fixtures (global narrow load/store, direct surface atomics, F2I immediate) and actionlint over the
# workflows. No Python test step is involved and no game data is read. The paths below start a run only for a change
# one of these checks reads (the docs some Rust tests read included); actionlint's own job runs when a workflow changes.
name: Game-free source regressions

