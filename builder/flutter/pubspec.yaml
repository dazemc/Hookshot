name: hookshot_builder
description: Hookshot Builder for Linux and Windows (Flutter replacement for the Tk and WPF builders).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  args: ^2.7.0
  crypto: ^3.0.8
  archive: ^4.6.0
  path: ^1.9.1
  file_selector: ^1.1.0
  window_manager: ^0.6.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  ffi: ^2.1.0
  fluent_ui: ^4.17.0
  bitsdojo_window: ^0.1.6
  lucide_icons_flutter: ^3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
