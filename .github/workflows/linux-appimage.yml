# The Linux AppImage (x86_64): Hookshot Builder (Flutter), its Rust engine, the a64emit translator and the sources a game
# is built from. No Python runtime and no game data are in it: the player's own clang builds the game from the sources the
# image carries, as a checkout would. Built in Ubuntu 22.04, the oldest system it is for (glibc 2.35).
#
# A workflow artifact on every run; for a release, also an asset of its release (scripts/release_upload.sh, shared with
# the Windows builder workflow). A release is a tag pushed by hand, or the tag the Release workflow passes when it calls
# this one (inputs.tag). On any other push to main, the same files replace those of the nightly prerelease, the latest
# development build.
name: Linux AppImage
on:
  push:
    branches: [main]
    tags: ['*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.release-please-manifest.json'
  # (not for a pull request that changes only documentation or the release manifest: nothing of them is compiled or
  # packaged but readme.md, which is only copied in. A push to main builds every time)
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.release-please-manifest.json'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: the release's tag, already created; it is checked out and its release gets the files
        type: string
        required: true
permissions:
  contents: read
env:
  # (the release this run is for: the tag passed by the Release workflow, or a pushed tag; empty on other runs)
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
  # (the builder app's toolchain: the same major Flutter the app is developed with. The tarball's SHA-256 is checked)
  FLUTTER_VERSION: '3.47.5'
  FLUTTER_SHA256: '2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb'
  RUST_VERSION: '1.99.1'
concurrency:
  group: linux-appimage-${{ inputs.tag || github.ref }}
  # (a pull request's older run is cancelled; a push's or a tag's never is)
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag') }}

jobs:
  appimage:
    # (builder-parts holds the installer's parts: no AppImage there, and it must never be made "latest")
    # (nightly is moved by the release job of a push to main, and rc by the Release workflow: never built as a tag)
    if: >-
      github.ref_name != 'builder-parts' && github.ref_name != 'linux-parts' && github.ref_name != 'nightly'
      && github.ref_name != 'rc'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    # (Flutter's SDK and engine artifacts are the slow part, then the app and the engine)
    timeout-minutes: 60
    # (id-token and attestations: a release's build provenance)
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # (dpkg without an fsync per file: this container is thrown away after the job, so an install cut short loses nothing)
      - name: Package installs without fsync
        run: echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/force-unsafe-io
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          retry_packages() {
            for try in 1 2 3; do
              if "$@"; then return 0; else package_status=$?; fi
              if [ "$try" = 3 ]; then return "$package_status"; fi
              sleep 20
            done
          }
          base_packages() {
            apt-get update &&
              apt-get install -y --no-install-recommends ca-certificates curl gpg
          }
          toolchain_packages() {
            # (clang and lld build the Flutter runner and the a64emit translator; Flutter's Linux desktop needs GTK 3,
            # cmake, ninja and pkg-config; cargo's curl/openssl crates need a cc, OpenSSL's headers and perl.
            # xvfb is the check's display; zip and jq are the parts and the release upload, no Python anywhere)
            apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 \
              install -y --no-install-recommends \
              git ca-certificates curl xz-utils zstd file unzip zip jq xvfb xauth \
              clang lld cmake ninja-build pkg-config build-essential libssl-dev perl \
              libgtk-3-dev libstdc++-12-dev libgl1 libgl1-mesa-dri libglx-mesa0 libegl1
          }
          retry_packages base_packages
          retry_packages toolchain_packages

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # (a release's tag: the AppImage is named by git describe)
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # (the Flutter SDK, pinned and checked: no third-party action, and the same version locally and in CI)
      - if: env.RELEASE_TAG == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/flutter/bin/cache
            /root/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-${{ hashFiles('builder/flutter/pubspec.lock') }}
      - name: Flutter
        run: |
          curl -fL --retry 5 --retry-delay 10 --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 900 \
            -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C /opt
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter config --no-analytics >/dev/null || true
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      # (cargo is not in the 22.04 container; rustup's minimal profile is rustc and cargo only)
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/rustup.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain "$RUST_VERSION" --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: env.RELEASE_TAG == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
          key: cargo-${{ env.RUST_VERSION }}-${{ hashFiles('builder/rust/Cargo.lock') }}

      # work/: the lists and the play profile made on the development PC (addresses and counts, no game code). When the
      # repository does not carry them, the newest published release's app part is read with curl and unzip: a fork with
      # no release takes upstream's. Optional either way; no Python.
      - name: Play profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f work/hot_order.txt ]; then echo "work/ is in the repository"; exit 0; fi
          auth=()
          [ -n "${GH_TOKEN:-}" ] && auth=(-H "Authorization: Bearer $GH_TOKEN")
          for repo in "$GITHUB_REPOSITORY" NotRexed/Hookshot; do
            api="https://api.github.com/repos/$repo/releases/latest"
            list=$(curl -fsSL --retry 5 --retry-delay 10 "${auth[@]}" -H "Accept: application/vnd.github+json" "$api" 2>/dev/null |
              sed -n 's/.*"browser_download_url": *"\([^"]*hookshot-setup\.txt\)".*/\1/p' | head -1) || true
            [ -n "$list" ] || continue
            curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/setup.txt" "$list" || continue
            part=$(awk '$1 == "part" && $5 ~ /HookshotBuilder-app-/ { print $5; exit }' "$RUNNER_TEMP/setup.txt")
            [ -n "$part" ] || continue
            curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/app.zip" "$part" || continue
            rm -rf "$RUNNER_TEMP/profile"
            unzip -q "$RUNNER_TEMP/app.zip" 'HookshotBuilder/tools/work/*' -d "$RUNNER_TEMP/profile" || continue
            mkdir -p work
            cp -a "$RUNNER_TEMP/profile/HookshotBuilder/tools/work/." work/
            echo "play profile from $repo"
            ls -la work work/image 2>/dev/null || true
            exit 0
          done
          echo "no release with a play profile: built without it"

      # (with its update information and .zsync, for AppImageUpdate and Gear Lever: this repository's latest release, for
      # the nightly the next nightly, and for a release candidate the rc release, which holds the newest release candidate
      # or release (scripts/release_rc.sh): it moves on to the next release candidate and its version's release, never
      # back to an older release, as the builder's Release candidate Update track does)
      - name: AppImage
        env:
          # (a release is named by its tag: a promoted version's commit also has its release candidate's tag, which git
          # describe could name instead)
          HOOKSHOT_VERSION: ${{ env.RELEASE_TAG }}
          HOOKSHOT_UPDATE_RELEASE: >-
            ${{ env.RELEASE_TAG == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nightly'
            || contains(env.RELEASE_TAG, '-') && 'rc' || 'latest' }}
        run: scripts/linux/appimage.sh

      # (a release's or the nightly's files, signed as built by this run: gh attestation verify <file> -R <this repository>)
      - if: env.RELEASE_TAG != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build-linux/*.AppImage
            build-linux/*.AppImage.zsync
            build-linux/parts/hookshot-linux.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hookshot-linux-x86_64
          path: |
            build-linux/*.AppImage
            build-linux/*.AppImage.zsync
          if-no-files-found: error

      # (the image a player downloads, not the checkout: the Flutter app starts under Xvfb, the engine answers, the
      # translator is there, and no Python is in it. After the upload, so a failing image can be looked at)
      - name: The image is a player's builder
        run: scripts/linux/check_bundle.sh build-linux/Hookshot-*-x86_64.AppImage

      # (the update parts of a release or of the nightly, for the release job: scripts/linux/make_parts.sh. Not on other
      # runs: about the size of the image)
      - if: env.RELEASE_TAG != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hookshot-linux-parts
          path: build-linux/parts/
          if-no-files-found: error

  release:
    name: Release asset
    if: >-
      inputs.tag != '' || (startsWith(github.ref, 'refs/tags/') && github.ref_name != 'builder-parts'
      && github.ref_name != 'linux-parts' && github.ref_name != 'nightly' && github.ref_name != 'rc')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # (id-token and attestations: SHA256SUMS, when it is made here)
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SUMS_OUT: dist/SHA256SUMS
      # (called by the Release workflow: its draft is there already, and no release is made here)
      RELEASE_FROM_WORKFLOW: ${{ inputs.tag && 'true' || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Hookshot-linux-x86_64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Hookshot-linux-parts
          path: dist/parts
      # (the parts to the linux-parts release, which is never "latest"; a part already there is not uploaded again)
      - name: Update parts
        run: scripts/linux/publish_parts.sh dist/parts
      # (the Release workflow's draft release, or for a tag pushed by hand the release made here or by the Windows
      # builder workflow, whichever is first; a -rc tag is a prerelease and never "latest". A tag pushed by hand and the
      # nightly also get their SHA256SUMS here; a draft gets it from the Release workflow's publish job)
      - name: AppImage to the release
        # (a push to main that is not a release: the nightly)
        run: >-
          scripts/release_upload.sh "${RELEASE_TAG:-nightly}" dist/*.AppImage dist/*.AppImage.zsync
          dist/parts/hookshot-linux.txt
      - if: hashFiles('dist/SHA256SUMS') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
