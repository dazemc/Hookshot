[package]
name = "hookshot_engine"
version = "0.1.0"
edition = "2024"
description = "Hookshot Builder's Rust engine: profiles, pins, launcher options and diagnostics"
publish = false

[workspace]
members = ["zbic"]
default-members = [".", "zbic"]

[lib]
name = "hookshot_engine"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
zstd = "0.13"
sha2 = "0.10"
sha1 = "0.10"
walkdir = "2"
libloading = "0.8"
png = "0.17"
regex = "1"
curl = "0.4"
crc32fast = "1.5"
ttf-parser = "0.25"

[profile.release]
lto = "thin"
strip = true
